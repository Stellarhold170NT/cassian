# Cassian documentation linter — modeled on GitLab's .vale.ini structure.
# Run: vale --minAlertLevel=error $(git ls-files '*.md' | grep -v '^modules/')
# Gate: zero errors on every markdown file we author.

StylesPath = resources/vale/styles
MinAlertLevel = suggestion

IgnoredScopes = code, tt, samp

# Base rule set for every markdown file we author.
[*.md]
BasedOnStyles = cassian_base, cassian_docs

# Upstream code is byte-identical to the pin: never linted, never edited.
[**/modules/**]
BasedOnStyles =

# Except the READMEs we generate into each module directory.
[**/modules/**/README.md]
BasedOnStyles = cassian_base, cassian_docs

# External reference material copied under resources/ — hard checks only.
[**/resources/**]
BasedOnStyles = cassian_base
